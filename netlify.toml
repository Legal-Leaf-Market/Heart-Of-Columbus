# Heart of Columbus on Netlify. The live site builds from the `live` branch,
# which .github/workflows/publish.yml moves up to `main` in batches (5 site
# changes or 4 hours, or [publish] in a PR title). `main` is a free branch
# deploy (main--heartofcolumbus.netlify.app).
# See "Publishing" in CLAUDE.md for why (Netlify credits, 2026-11-26).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The paper is launched (Jake, 2026-11-24): the News link shows in the main
  # menu everywhere. Search indexing is a separate switch (HOC_INDEX).
  NEWS_LIVE = "1"
  # Launched (Jake, 2026-11-24): search engines may index the site. Deploy
  # previews and branch deploys stay noindex (src/indexing.mjs checks CONTEXT).
  HOC_INDEX = "1"
  # The site's own address (Jake, 2026-11-24: heartofcolumbus.shop is live).
  # Canonical links, share images, the sitemap and every QR code in the
  # print edition are built from it. src/jsonld.mjs and the functions fall
  # back to the same address when it is unset.
  HOC_ORIGIN = "https://heartofcolumbus.shop"


[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every page loads these with ?v=<content hash> (src/layout.mjs), so a changed
# file is a new URL and a year in the browser cache is safe.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# X-Robots-Tag is written to dist/_headers by build.mjs from src/indexing.mjs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[functions]
  directory = "netlify/functions"

# Smoke & Vape became its own section (2026-11-24); its old address under
# Shopping goes to the new one.
[[redirects]]
  from = "/c/shopping/smoke/*"
  to = "/c/smoke/:splat"
  status = 301

# Rabbit's Balloons now deploys from its own repository.
[[redirects]]
  from = "/preview/rabbits-balloons"
  to = "https://rabbits-balloons.netlify.app/"
  status = 301

[[redirects]]
  from = "/preview/rabbits-balloons/*"
  to = "https://rabbits-balloons.netlify.app/:splat"
  status = 301
