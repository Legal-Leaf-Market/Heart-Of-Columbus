# Heart of Columbus on Netlify. Pushes to main deploy automatically.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # The paper is launched (Jake, 2026-11-24): the News link shows in the main
  # menu everywhere. Search indexing is a separate switch (HOC_INDEX).
  NEWS_LIVE = "1"
  # Launched (Jake, 2026-11-24): search engines may index the site. Deploy
  # previews and branch deploys stay noindex (src/indexing.mjs checks CONTEXT).
  # When the domain is bought, set HOC_ORIGIN to it here or in Netlify.
  HOC_INDEX = "1"


[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Every page loads these with ?v=<content hash> (src/layout.mjs), so a changed
# file is a new URL and a year in the browser cache is safe.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# X-Robots-Tag is written to dist/_headers by build.mjs from src/indexing.mjs.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self)"

[functions]
  directory = "netlify/functions"
