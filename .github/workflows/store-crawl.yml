# The daily store crawl. Reads every listed business website for its
# ordering, booking and shop systems (scripts/probe-deep.mjs), rebuilds
# src/data/commerce.mjs (scripts/import-commerce.mjs), then saves what each
# shop and restaurant sells, as its own site publishes it, to
# public/catalogs/ (scripts/snapshot-catalogs.mjs). Read-only toward the
# businesses: public pages, nothing posted.
#
# On the daily schedule the results go to the crawl/daily branch with a pull
# request, so a person reviews them (and Netlify builds a preview) before
# anything reaches the site. Run from a claude/** branch by editing
# scripts/data/crawl-request.txt, it commits to that branch instead.
name: Store crawl
on:
  schedule:
    - cron: '17 8 * * *' # 3:17 AM in Columbus (EST), before anyone shops
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/data/crawl-request.txt']
permissions:
  contents: write
  pull-requests: write
concurrency:
  group: store-crawl
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scan every website
        run: node scripts/probe-deep.mjs scripts/data/probe-deep.json
      - name: Rebuild ordering, booking and shop links
        run: node scripts/import-commerce.mjs scripts/data/probe-results.json scripts/data/probe-deep.json
      - name: Save catalogs and menus
        run: node scripts/snapshot-catalogs.mjs
      - name: Commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/probe-deep.json scripts/data/crawl-report.json src/data/commerce.mjs src/data/catalogs.mjs public/catalogs
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          SUMMARY=$(node -e "const r=require('./scripts/data/crawl-report.json');console.log(r.withCatalog+' of '+r.crawled+' shops and restaurants have a saved catalog or menu ('+Object.entries(r.byMethod).map(([k,v])=>v+' by '+k).join(', ')+').')")
          if [ "${{ github.event_name }}" = "push" ]; then
            git commit -m "Store crawl results: $SUMMARY"
            git push
            exit 0
          fi
          git checkout -B crawl/daily
          git commit -m "Daily store crawl, $(date -u +%F): $SUMMARY"
          git push -f origin crawl/daily
          if [ -z "$(gh pr list --head crawl/daily --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head crawl/daily --base main --title "Daily store crawl" --body "Automatic results from the Store crawl workflow. $SUMMARY

          Check the Netlify preview's /order/ page and scripts/data/crawl-report.json, then merge. Each run replaces this branch with that day's results."
          fi
