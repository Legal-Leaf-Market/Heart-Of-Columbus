# Reads every listed business website for its ordering, booking and shop
# systems (scripts/probe-deep.mjs) and commits the results, so the commerce
# data can be rebuilt from a machine with open internet. Read-only toward
# the businesses: a few public pages per site, nothing posted.
name: Probe commerce
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/data/probe-request.txt']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/probe-deep.mjs scripts/data/probe-deep.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/probe-deep.json
          git diff --cached --quiet || git commit -m "Probe results from the Probe commerce workflow"
          git push
