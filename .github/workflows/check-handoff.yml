# Checks that the one cart really hands off to the shops (scripts/check-handoff.mjs):
# reads every live catalog through the deployed site, follows our add-to-cart
# links on WooCommerce shops and reads back that session's cart from the shop.
# Trigger: edit scripts/data/handoff-request.txt on a claude branch, or run it
# by hand. Leaves at most two items in an anonymous cart per Woo shop; never
# checks out.
name: Check cart handoff
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['scripts/data/handoff-request.txt']
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-handoff.mjs scripts/data/handoff-check.json
      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/data/handoff-check.json
          git diff --cached --quiet || git commit -m "Handoff check from the Check cart handoff workflow"
          git push
