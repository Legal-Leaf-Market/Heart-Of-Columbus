# Cisco's Barbershop, deployed as its own Netlify site.
# In Netlify set Base directory to sites/ciscos-barber-shop. No build step.
[build]
  publish = "."
  command = ""
  # Build only when this folder changed since the last deploy (exit 0 skips).
  # A publish of Heart of Columbus alone should not cost Cisco's a deploy too.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Draft: keep out of search until Cisco approves. Delete this line to go live.
    X-Robots-Tag = "noindex, nofollow"
