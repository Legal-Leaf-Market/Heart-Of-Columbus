# TJ's ChopShop, deployed as its own Netlify site.
# In Netlify set Base directory to sites/tjs-chopshop. No build step.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Draft: keep out of search until TJ approves. Delete this line to go live.
    X-Robots-Tag = "noindex, nofollow"
